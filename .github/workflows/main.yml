name: Build Panda Vault APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Panda Vault APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Show repository files
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f -not -path './.git/*' | sort


      - name: Extract Panda Vault ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "PandaVault-GitHub-Ready.zip" ]; then
            ZIP_FILE="PandaVault-GitHub-Ready.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Panda Vault ZIP file was not found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort


      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Extracted repository:"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            | sort


      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.9"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -d "$GRADLE_DIR" ]; then

            echo "Downloading Gradle $GRADLE_VERSION..."

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O "$HOME/gradle.zip"

            unzip -q \
              "$HOME/gradle.zip" \
              -d "$HOME"

            rm "$HOME/gradle.zip"

          fi

          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Gradle version:"
          "$GRADLE_DIR/bin/gradle" --version


      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper already exists."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper not found."

            echo "Creating Gradle wrapper..."

            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle wrapper ready."


      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew --version


      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Panda Vault APK build..."

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_FILE" \
            "release/PandaVault-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh "release/PandaVault-debug.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PandaVault-APK
          path: release/PandaVault-debug.apk
          if-no-files-found: error
          retention-days: 30


      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " PANDA VAULT APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK file:"
          ls -lh release/PandaVault-debug.apk
          echo ""
          echo "Go to:"
          echo "Actions"
          echo "-> Build Panda Vault APK"
          echo "-> Artifacts"
          echo "-> PandaVault-APK"
          echo ""
          echo "======================================"
