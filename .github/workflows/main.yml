name: Build Panda Vault APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project files
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Check Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
          fi

      - name: Clean project
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Copy APK
        run: |
          mkdir -p release
          cp "${{ steps.find_apk.outputs.apk_path }}" \
             "release/PandaVault-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PandaVault-APK
          path: release/PandaVault-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build completed
        run: |
          echo "Panda Vault APK build completed successfully."
          ls -lh release/PandaVault-debug.apk
